<?xml version="1.0" encoding="UTF-8"?>
<svg width="600px" height="145px" viewBox="0 0 600 145" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Collective Genius</title>
    <desc>Three connected nodes, representing collective intelligence, beside the wordmark "Collective Genius".</desc>
    <g id="collective-genius-logo" fill="none" fill-rule="evenodd">
        <g id="mark-links" stroke="#2A3CD4" stroke-width="7" stroke-linecap="round">
            <path d="M40,100 L72,52" />
            <path d="M104,100 L72,52" />
            <path d="M40,100 L104,100" />
        </g>
        <g id="mark-nodes" fill="#2A3CD4">
            <circle cx="72" cy="42" r="14" />
            <circle cx="32" cy="106" r="14" />
            <circle cx="112" cy="106" r="14" />
        </g>
        <text id="wordmark" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#222222" x="148" y="88">Collective <tspan fill="#2A3CD4">Genius</tspan></text>
    </g>
</svg>
